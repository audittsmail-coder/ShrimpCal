<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ชั่งกุ้งเป็น</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d2b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ชั่งกุ้งเป็น">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Shrimp Scale · แพกุ้ง</div>
    <h1>ชั่งกุ้งเป็น</h1>
    <div class="sub">ชั่งทีละรถ หลายตะกร้าต่อคัน แล้วรวมยอดเมื่อจบคัน</div>
  </header>

  <div class="panel">
    <div class="panel-title">ข้อมูลรถ</div>
    <div class="field">
      <label>ข้อมูลรถ <span class="unit">(เช่น ทะเบียน, คนขับ)</span></label>
      <input type="text" id="truckInfo" placeholder="เช่น 70-1234">
    </div>
    <div class="field">
      <label>น้ำหนักตะกร้า <span class="unit">(กก. — หักออกจากทุกตะกร้าที่ชั่ง)</span></label>
      <input type="number" id="tareWeight" inputmode="decimal" step="0.01" placeholder="0.00">
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">ตะกร้า — คันปัจจุบัน <span id="basketNextNo" style="text-transform:none; font-weight:400;"></span></div>
    <div class="add-basket-row">
      <input type="number" id="basketWeight" inputmode="decimal" step="0.01" placeholder="0.00">
      <button type="button" id="addBasketBtn">+ เพิ่มตะกร้า</button>
    </div>
    <div id="basketGrid" class="basket-grid"></div>
    <div class="rest-subtotal"><span>จำนวนตะกร้า</span><span id="basketCount">0 ใบ</span></div>
    <div class="rest-subtotal"><span>น้ำหนักรวมก่อนหักตะกร้า</span><span id="truckGross">0.00 กก.</span></div>
    <div class="rest-subtotal"><span>น้ำหนักสุทธิ (หลังหักตะกร้า)</span><span id="truckNet">0.00 กก.</span></div>
    <button type="button" class="add-row" id="finishTruckBtn">✓ รวมน้ำหนักรถคันนี้ &amp; เริ่มคันใหม่</button>
  </div>

  <div class="panel">
    <div class="panel-title">สรุปแต่ละคัน</div>
    <div id="truckList"></div>
    <div class="rest-subtotal"><span>รวมทุกคัน</span><span id="grandTotal">0.00 กก.</span></div>
  </div>

  <button class="reset" id="resetBtn">ล้างข้อมูลทั้งหมด</button>
  <div class="credit">Crafted by · Singha Jewvutthipong</div>
</div>

<script src="script.js"></script>
</body>
</html>
