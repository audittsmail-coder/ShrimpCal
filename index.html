<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ShimCal · เครื่องมือชั่งกุ้ง</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShimCal">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg: #0a1830;
    --panel: #11233f;
    --panel-2: #152c4d;
    --line: #27466b;
    --ink: #eef2f9;
    --ink-dim: #9db2cc;
    --teal-accent: #4da3ff;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0;
    background: var(--bg);
    font-family: 'Noto Sans Thai', 'Sarabun', system-ui, sans-serif;
    color: var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .weather-bar{
    display:flex;
    align-items:center;
    gap: 12px;
    background: linear-gradient(135deg, var(--panel), var(--panel-2));
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top, 0));
    flex-shrink:0;
  }
  .weather-bar.hidden{ display:none; }
  .weather-icon{ font-size: 28px; line-height:1; flex-shrink:0; }
  .weather-info{ flex-shrink:0; min-width:0; }
  .weather-temp{
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
    line-height:1.15;
  }
  .weather-desc{
    font-size: 11.5px;
    color: var(--ink-dim);
    margin-top: 1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .weather-stats{
    display:flex;
    gap: 14px;
    margin-left:auto;
    flex-shrink:0;
  }
  .weather-stat{ text-align:right; }
  .ws-label{
    display:block;
    font-size: 9.5px;
    color: var(--ink-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .ws-value{
    display:block;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--teal-accent);
  }
  .tabbar{
    display:flex;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-shrink:0;
  }
  .tabbar button{
    flex:1;
    background: transparent;
    border:none;
    border-bottom: 3px solid transparent;
    color: var(--ink-dim);
    font-family: 'Noto Sans Thai', 'Sarabun', system-ui, sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    padding: 14px 8px 11px;
    cursor: pointer;
  }
  .tabbar button.active{
    color: var(--teal-accent);
    border-bottom-color: var(--teal-accent);
  }
  .frame-wrap{
    flex:1;
    position:relative;
    min-height:0;
  }
  iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    display:none;
    background: var(--bg);
  }
  iframe.active{ display:block; }
</style>
</head>
<body>
  <div class="weather-bar" id="weatherBar">
    <div class="weather-icon" id="weatherIcon">⛅</div>
    <div class="weather-info">
      <div class="weather-temp" id="weatherTemp">--°C</div>
      <div class="weather-desc" id="weatherDesc">กำลังโหลดสภาพอากาศ…</div>
    </div>
    <div class="weather-stats">
      <div class="weather-stat"><span class="ws-label">ความชื้น</span><span class="ws-value" id="weatherHumidity">--%</span></div>
      <div class="weather-stat"><span class="ws-label">โอกาสฝน</span><span class="ws-value" id="weatherRain">--%</span></div>
    </div>
  </div>
  <nav class="tabbar" id="tabbar">
    <button type="button" class="active" data-tab="calc">คำนวณชั่งกุ้ง</button>
    <button type="button" data-tab="scale">ชั่งกุ้งต้ม</button>
    <button type="button" data-tab="live">ชั่งกุ้งเป็น</button>
  </nav>
  <div class="frame-wrap">
    <iframe id="frame-calc" class="active" src="calc/index.html" title="คำนวณชั่งกุ้ง"></iframe>
    <iframe id="frame-scale" src="scale/index.html" title="ชั่งกุ้งต้ม"></iframe>
    <iframe id="frame-live" src="live/index.html" title="ชั่งกุ้งเป็น"></iframe>
  </div>

<script>
  const buttons = document.querySelectorAll('#tabbar button');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.frame-wrap iframe').forEach(f => f.classList.remove('active'));
      document.getElementById('frame-' + btn.dataset.tab).classList.add('active');
    });
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {
        // ignore registration errors (e.g. running from file://)
      });
    });
  }

  const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=7.9514&longitude=98.9978&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,rain,precipitation,weather_code&timezone=Asia%2FBangkok';

  // WMO weather codes -> [icon, Thai description]
  const WEATHER_CODES = {
    0: ['☀️', 'ท้องฟ้าแจ่มใส'],
    1: ['🌤️', 'มีเมฆบางส่วน'],
    2: ['⛅', 'เมฆเป็นบางส่วน'],
    3: ['☁️', 'เมฆมาก'],
    45: ['🌫️', 'หมอก'],
    48: ['🌫️', 'หมอกน้ำแข็ง'],
    51: ['🌦️', 'ฝนตกปรอยๆเบาบาง'],
    53: ['🌦️', 'ฝนตกปรอยๆ'],
    55: ['🌦️', 'ฝนตกปรอยๆหนัก'],
    56: ['🌧️', 'ฝนตกปรอยๆเยือกแข็ง'],
    57: ['🌧️', 'ฝนตกปรอยๆเยือกแข็งหนัก'],
    61: ['🌧️', 'ฝนตกเบาๆ'],
    63: ['🌧️', 'ฝนตก'],
    65: ['🌧️', 'ฝนตกหนัก'],
    66: ['🌧️', 'ฝนเยือกแข็งเบาๆ'],
    67: ['🌧️', 'ฝนเยือกแข็งหนัก'],
    71: ['🌨️', 'หิมะตกเบาๆ'],
    73: ['🌨️', 'หิมะตก'],
    75: ['🌨️', 'หิมะตกหนัก'],
    77: ['🌨️', 'เกล็ดหิมะ'],
    80: ['🌦️', 'ฝนตกเป็นช่วงๆเบาๆ'],
    81: ['🌦️', 'ฝนตกเป็นช่วงๆ'],
    82: ['🌦️', 'ฝนตกเป็นช่วงๆหนัก'],
    85: ['🌨️', 'หิมะตกเป็นช่วงๆเบาๆ'],
    86: ['🌨️', 'หิมะตกเป็นช่วงๆหนัก'],
    95: ['⛈️', 'พายุฝนฟ้าคะนอง'],
    96: ['⛈️', 'พายุฝนฟ้าคะนองมีลูกเห็บ'],
    99: ['⛈️', 'พายุฝนฟ้าคะนองมีลูกเห็บหนัก'],
  };

  // Formats "now" as the same "YYYY-MM-DDTHH:00" local-hour string the API
  // uses for hourly.time, in Asia/Bangkok time regardless of the viewer's
  // own device timezone.
  function bangkokNowHourString(){
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Bangkok',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', hour12: false
    }).formatToParts(new Date());
    const get = (type) => parts.find((p) => p.type === type).value;
    let hour = get('hour');
    if (hour === '24') hour = '00';
    return `${get('year')}-${get('month')}-${get('day')}T${hour}:00`;
  }

  async function loadWeather(){
    try {
      const res = await fetch(WEATHER_URL);
      if (!res.ok) throw new Error('weather request failed');
      const data = await res.json();
      const h = data.hourly;
      let idx = h.time.indexOf(bangkokNowHourString());
      if (idx === -1) idx = 0;

      const [icon, desc] = WEATHER_CODES[h.weather_code[idx]] || ['🌡️', '-'];
      document.getElementById('weatherIcon').textContent = icon;
      document.getElementById('weatherTemp').textContent = Math.round(h.temperature_2m[idx]) + '°C';
      document.getElementById('weatherDesc').textContent = desc;
      document.getElementById('weatherHumidity').textContent = Math.round(h.relative_humidity_2m[idx]) + '%';
      document.getElementById('weatherRain').textContent = Math.round(h.precipitation_probability[idx]) + '%';
    } catch (e) {
      document.getElementById('weatherBar').classList.add('hidden');
    }
  }
  loadWeather();
</script>
</body>
</html>
