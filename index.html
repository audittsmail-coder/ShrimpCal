<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ShimCal · เครื่องมือชั่งกุ้ง</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d2b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShimCal">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg: #0d2b2e;
    --panel: #123539;
    --line: #2c565b;
    --ink: #eef2ea;
    --ink-dim: #9fb8b6;
    --teal-accent: #3fb6a8;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0;
    background: var(--bg);
    font-family: 'Noto Sans Thai', 'Sarabun', system-ui, sans-serif;
    color: var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .tabbar{
    display:flex;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-shrink:0;
    padding-top: env(safe-area-inset-top, 0);
  }
  .tabbar button{
    flex:1;
    background: transparent;
    border:none;
    border-bottom: 3px solid transparent;
    color: var(--ink-dim);
    font-family: 'Noto Sans Thai', 'Sarabun', system-ui, sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    padding: 14px 8px 11px;
    cursor: pointer;
  }
  .tabbar button.active{
    color: var(--teal-accent);
    border-bottom-color: var(--teal-accent);
  }
  .frame-wrap{
    flex:1;
    position:relative;
    min-height:0;
  }
  iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    display:none;
    background: var(--bg);
  }
  iframe.active{ display:block; }
</style>
</head>
<body>
  <nav class="tabbar" id="tabbar">
    <button type="button" class="active" data-tab="calc">คำนวณชั่งกุ้ง</button>
    <button type="button" data-tab="scale">ชั่งกุ้ง (ตะกร้า)</button>
  </nav>
  <div class="frame-wrap">
    <iframe id="frame-calc" class="active" src="calc/index.html" title="คำนวณชั่งกุ้ง"></iframe>
    <iframe id="frame-scale" src="scale/index.html" title="ชั่งกุ้ง (ตะกร้า)"></iframe>
  </div>

<script>
  const buttons = document.querySelectorAll('#tabbar button');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.frame-wrap iframe').forEach(f => f.classList.remove('active'));
      document.getElementById('frame-' + btn.dataset.tab).classList.add('active');
    });
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {
        // ignore registration errors (e.g. running from file://)
      });
    });
  }
</script>
</body>
</html>
