<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>นับลูกกุ้ง</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="นับลูกกุ้ง">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#0a1830; --surface:#11233f; --ink:#eef2f9; --muted:#9db2cc;
  --line:#27466b; --pond:#4da3ff; --pond-ink:#0a1830; --shrimp:#e6733a; --shrimp-soft:rgba(230,115,58,0.18);
  --key:#152c4d;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;font-size:17px;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "entry" "tally" "set" "res";column-gap:16px;align-items:start}
.head{grid-area:head}
section[aria-labelledby="h-entry"]{grid-area:entry}
section[aria-labelledby="h-scoops"]{grid-area:tally}
section[aria-labelledby="h-set"]{grid-area:set}
section[aria-labelledby="h-res"]{grid-area:res}
@media (min-width:760px), (orientation:landscape) and (min-width:560px){
  main{max-width:1100px;grid-template-columns:minmax(280px,400px) minmax(0,1fr);grid-template-areas:"head head" "entry tally" "res set"}
}
@media (orientation:landscape) and (max-height:520px){
  main{padding-top:10px}
  .sub{display:none}
  h1{font-size:1.3rem;margin-bottom:8px}
  section{padding:12px}
  .pad{gap:6px}
  .pad button{height:46px;font-size:1.3rem}
  .display{padding:6px 12px;margin-bottom:8px}
  .display .cur{font-size:2rem;min-height:2rem}
}
h1{font-family:"Mitr","Sarabun",sans-serif;font-weight:500;font-size:1.6rem;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 18px}
h2{font-family:"Mitr","Sarabun",sans-serif;font-weight:500;font-size:1.1rem;margin:0 0 10px}
section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}

/* Entry */
.display{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  background:var(--key);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.display .cur{font-family:"Mitr",sans-serif;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;min-height:2.6rem}
.display .cur.empty{color:var(--muted)}
.display .hint{color:var(--muted);font-size:.95rem}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font-family:"Mitr",sans-serif;font-size:1.6rem;height:62px;border-radius:12px;border:1px solid var(--line);
  background:var(--key);color:var(--ink);cursor:pointer;touch-action:manipulation}
.pad button:active{transform:scale(.97)}
.pad .back{font-size:1.1rem}
.add{grid-column:1/-1;background:var(--pond)!important;color:var(--pond-ink)!important;border-color:var(--pond)!important;font-size:1.25rem!important}
button:focus-visible,input:focus-visible{outline:3px solid var(--shrimp);outline-offset:2px}

/* Scoops */
.scoops{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr) auto 40px;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .val{font-family:"Mitr",sans-serif;font-size:1.35rem;font-weight:500;text-align:center;background:var(--key);border-radius:10px;padding:2px 0}
.trow .marks{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-height:30px;color:var(--ink)}
.trow .marks svg{display:block}
.trow .marks .none{color:var(--muted)}
.trow .cnt{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .cnt b{color:var(--ink);font-family:"Mitr",sans-serif;font-weight:500}
.trow .minus{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--shrimp-soft);color:var(--shrimp);font-size:1.2rem;cursor:pointer}
.trow .minus:disabled{visibility:hidden}
.trow.zero .val{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--key);color:var(--ink);
  border-radius:999px;padding:5px 8px 5px 12px;font-size:1rem;cursor:pointer}
.chip small{color:var(--muted)}
.chip b{font-family:"Mitr",sans-serif;font-weight:500}
.chip .x{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--shrimp-soft);color:var(--shrimp);font-size:.9rem}
.empty-note{color:var(--muted);margin:0}
.stats{display:flex;gap:18px;margin-top:12px;color:var(--muted);flex-wrap:wrap}
.stats strong{color:var(--ink);font-family:"Mitr",sans-serif;font-weight:500}
.row-actions{display:flex;gap:8px;margin-top:12px}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.ghost.danger{color:var(--shrimp);border-color:var(--shrimp)}

/* Settings */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.field{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.field label{display:block;font-weight:600;margin-bottom:4px}
.field .unit{color:var(--muted);font-weight:400}
.stepper{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--key)}
.stepper button{flex:0 0 44px;width:44px;border:0;background:none;color:var(--pond);font-size:1.4rem;cursor:pointer}
.stepper input{flex:1 1 0;min-width:0;width:100%;border:0;background:none;color:var(--ink);text-align:center;font-family:"Mitr",sans-serif;font-size:1.3rem;padding:10px 0}
.plain-input{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--key);color:var(--ink);text-align:center;font-family:"Mitr",sans-serif;font-size:1.3rem;padding:10px 0}
.plain-input::placeholder{color:var(--muted);font-size:1rem}
.mode{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.mode button{flex:1;border:0;background:var(--key);color:var(--ink);padding:10px;font:inherit;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--pond);color:var(--pond-ink);font-weight:600}
.mode-note{color:var(--muted);font-size:.92rem;margin:8px 0 0}

/* Result */
.result{background:var(--pond);color:var(--pond-ink);border:0}
.result h2{opacity:.85}
.total{font-family:"Mitr",sans-serif;font-weight:600;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.05;font-variant-numeric:tabular-nums;word-break:break-all}
.total span{font-size:1.1rem;font-weight:400}
.formula{margin-top:14px;border-top:1px solid color-mix(in srgb,var(--pond-ink) 30%,transparent);padding-top:10px}
.formula div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.formula div span:last-child{font-family:"Mitr",sans-serif;font-variant-numeric:tabular-nums;text-align:right}
.formula .sep{margin-top:6px;padding-top:9px;border-top:1px dashed color-mix(in srgb,var(--pond-ink) 30%,transparent)}
.order-compare{margin-top:14px;border-top:1px solid color-mix(in srgb,var(--pond-ink) 30%,transparent);padding-top:10px}
.order-compare div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.order-compare div span:last-child{font-family:"Mitr",sans-serif;font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.order-compare .diff.under{color:var(--shrimp)}
.credit{text-align:right;margin-top:4px;color:var(--muted);font-size:.8rem}
@media (max-width:330px){.fields{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.pad button:active{transform:none}}
</style>
</head>
<body>
<main>
  <div class="head">
  <h1>นับลูกกุ้ง</h1>
  <p class="sub">ใส่จำนวนที่นับได้ทีละแก้ว แล้วระบบจะคิดจากขนาดแก้วตัก ลิตรต่อถัง จำนวนถัง และจำนวนรถให้</p>
  </div>

  <section aria-labelledby="h-entry">
    <h2 id="h-entry">นับได้กี่ตัวในแก้วนี้</h2>
    <div class="display">
      <div id="cur" class="cur empty" aria-live="polite">0</div>
      <div class="hint" id="nextLabel">แก้วที่ 1</div>
    </div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="clear" class="back" aria-label="ล้างตัวเลข">ล้าง</button>
      <button data-k="0">0</button>
      <button data-k="back" class="back" aria-label="ลบตัวสุดท้าย">⌫</button>
      <button data-k="add" class="add">เพิ่ม</button>
    </div>
  </section>

  <section aria-labelledby="h-scoops">
    <h2 id="h-scoops">แก้วที่นับแล้ว</h2>
    <div class="scoops" id="scoops"></div>
    <div class="stats" id="stats"></div>
    <div class="row-actions">
      <button class="ghost" id="undo">ย้อนแก้วล่าสุด</button>
      <button class="ghost danger" id="reset">เริ่มนับใหม่</button>
    </div>
  </section>

  <section aria-labelledby="h-set">
    <h2 id="h-set">ตัวคูณ</h2>
    <div class="fields">
      <div class="field">
        <label for="scoop">ขนาดแก้วตัก <span class="unit">(ลิตร)</span></label>
        <div class="stepper"><button data-step="scoop" data-d="-0.5" aria-label="ลดขนาดแก้วตัก">−</button><input id="scoop" type="number" inputmode="decimal" min="0" step="0.1" value="1"><button data-step="scoop" data-d="0.5" aria-label="เพิ่มขนาดแก้วตัก">+</button></div>
      </div>
      <div class="field">
        <label for="cup">ลิตรต่อถัง <span class="unit">(ลิตร)</span></label>
        <div class="stepper"><button data-step="cup" data-d="-10" aria-label="ลดจำนวนลิตรต่อถัง">−</button><input id="cup" type="number" inputmode="decimal" min="0" step="1" value="1"><button data-step="cup" data-d="10" aria-label="เพิ่มจำนวนลิตรต่อถัง">+</button></div>
      </div>
      <div class="field">
        <label for="tanks">ถังต่อรถ 1 คัน</label>
        <div class="stepper"><button data-step="tanks" data-d="-1" aria-label="ลดจำนวนถัง">−</button><input id="tanks" type="number" inputmode="numeric" min="0" step="1" value="1"><button data-step="tanks" data-d="1" aria-label="เพิ่มจำนวนถัง">+</button></div>
      </div>
      <div class="field">
        <label for="trucks">จำนวนรถ <span class="unit">(คัน)</span></label>
        <div class="stepper"><button data-step="trucks" data-d="-1" aria-label="ลดจำนวนรถ">−</button><input id="trucks" type="number" inputmode="numeric" min="0" step="1" value="1"><button data-step="trucks" data-d="1" aria-label="เพิ่มจำนวนรถ">+</button></div>
      </div>
      <div class="field">
        <label for="orderQty">ยอดสั่ง <span class="unit">(ตัว)</span></label>
        <input id="orderQty" class="plain-input" type="number" inputmode="numeric" min="0" step="1" placeholder="เช่น 600000">
      </div>
    </div>
    <div class="mode" role="group" aria-label="วิธีใช้ค่าที่นับ">
      <button id="mSum" aria-pressed="true">ใช้ผลรวม</button>
      <button id="mAvg" aria-pressed="false">ใช้ค่าเฉลี่ย</button>
    </div>
    <p class="mode-note" id="modeNote"></p>
  </section>

  <section class="result" aria-labelledby="h-res">
    <h2 id="h-res">ลูกกุ้งทั้งหมดโดยประมาณ</h2>
    <div class="total" id="total">0 <span>ตัว</span></div>
    <div class="formula" id="formula"></div>
    <div class="order-compare" id="orderCompare" hidden></div>
  </section>

  <div class="credit">Crafted by · Singha Jewvutthipong</div>
</main>

<script>
(function(){
  var KEY = 'shrimp-counter-v1';
  var state = { scoops: [], scoop: 1, cup: 1, tanks: 1, trucks: 1, mode: 'sum', orderQty: 0 };
  var entry = '';
  var nf = new Intl.NumberFormat('th-TH', { maximumFractionDigits: 2 });

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && Array.isArray(saved.scoops)) state = Object.assign(state, saved);
  } catch (e) {}

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var $ = function(id){ return document.getElementById(id); };

  function num(v){ var n = parseFloat(v); return isFinite(n) && n >= 0 ? n : 0; }

  function renderEntry(){
    var c = $('cur');
    c.textContent = entry === '' ? '0' : nf.format(+entry);
    c.classList.toggle('empty', entry === '');
    $('nextLabel').textContent = 'แก้วที่ ' + (state.scoops.length + 1);
  }

  function render(){
    renderEntry();
    var box = $('scoops');
    box.innerHTML = '';
    var counts = {};
    state.scoops.forEach(function(v){ counts[v] = (counts[v] || 0) + 1; });
    var vals = [3,4,5,6,7,8];
    Object.keys(counts).forEach(function(k){ if (vals.indexOf(+k) < 0) vals.push(+k); });
    vals.sort(function(a,b){ return a-b; });
    vals.forEach(function(v){
      var c = counts[v] || 0;
      var row = document.createElement('div');
      row.className = 'trow' + (c ? '' : ' zero');
      row.innerHTML = '<div class="val">' + nf.format(v) + '</div>' +
        '<div class="marks" aria-label="' + c + ' แก้ว">' + (c ? tally(c) : '<span class="none">–</span>') + '</div>' +
        '<div class="cnt"><b>' + nf.format(v * c) + '</b> ตัว</div>' +
        '<button class="minus" aria-label="ลบแก้วที่นับได้ ' + v + ' ตัว ออก 1 แก้ว"' + (c ? '' : ' disabled') + '>−</button>';
      row.querySelector('.minus').onclick = function(){
        var i = state.scoops.lastIndexOf(v);
        if (i > -1) { state.scoops.splice(i,1); save(); render(); }
      };
      box.appendChild(row);
    });

    var n = state.scoops.length;
    var sum = state.scoops.reduce(function(a,b){ return a+b; }, 0);
    var avg = n ? sum / n : 0;
    $('stats').innerHTML = n
      ? 'นับแล้ว <strong>' + n + '</strong> แก้ว &nbsp; รวม <strong>' + nf.format(sum) + '</strong> ตัว &nbsp; เฉลี่ย <strong>' + nf.format(avg) + '</strong> ตัว/แก้ว'
      : '';

    $('scoop').value = state.scoop; $('cup').value = state.cup; $('tanks').value = state.tanks; $('trucks').value = state.trucks;
    $('orderQty').value = state.orderQty ? state.orderQty : '';
    $('mSum').setAttribute('aria-pressed', state.mode === 'sum');
    $('mAvg').setAttribute('aria-pressed', state.mode === 'avg');
    $('modeNote').textContent = state.mode === 'sum'
      ? 'ผลรวมทุกแก้ว ÷ ขนาดแก้ว × ลิตรต่อถัง × จำนวนถัง × จำนวนรถ'
      : 'ค่าเฉลี่ยต่อแก้ว ÷ ขนาดแก้ว × ลิตรต่อถัง × จำนวนถัง × จำนวนรถ';

    var base = state.mode === 'sum' ? sum : avg;
    var S = num(state.scoop), L = num(state.cup), T = num(state.tanks), R = num(state.trucks);
    var perLiter = S > 0 ? base / S : 0;
    var perTank = perLiter * L, perTruck = perTank * T, total = perTruck * R;
    var r = function(x){ return nf.format(Math.round(x)); };
    $('total').innerHTML = r(total) + ' <span>ตัว</span>';
    $('formula').innerHTML =
      '<div><span>นับได้รวม (' + n + ' แก้ว)</span><span>' + nf.format(sum) + ' ตัว</span></div>' +
      '<div><span>เฉลี่ยต่อแก้ว (' + nf.format(S) + ' ลิตร)</span><span>' + nf.format(avg) + ' ตัว</span></div>' +
      '<div><span>คิดเป็นต่อ 1 ลิตร</span><span>' + nf.format(perLiter) + ' ตัว</span></div>' +
      '<div class="sep"><span>ต่อถัง (' + nf.format(L) + ' ลิตร)</span><span>' + r(perTank) + ' ตัว</span></div>' +
      '<div><span>ต่อรถ 1 คัน (' + nf.format(T) + ' ถัง)</span><span>' + r(perTruck) + ' ตัว</span></div>' +
      '<div><span>รถทั้งหมด ' + nf.format(R) + ' คัน</span><span>' + r(total) + ' ตัว</span></div>';

    var orderQty = num(state.orderQty);
    var compareEl = $('orderCompare');
    if (orderQty > 0) {
      var diff = Math.round(total) - orderQty;
      var diffPct = (diff / orderQty) * 100;
      var sign = diff > 0 ? '+' : (diff < 0 ? '−' : '');
      compareEl.hidden = false;
      compareEl.innerHTML =
        '<div><span>ยอดสั่ง</span><span>' + nf.format(orderQty) + ' ตัว</span></div>' +
        '<div><span>ต่างจากยอดสั่ง</span><span class="diff' + (diff < 0 ? ' under' : '') + '">' + sign + nf.format(Math.abs(diff)) + ' ตัว (' + sign + nf.format(Math.abs(diffPct)) + '%)</span></div>';
    } else {
      compareEl.hidden = true;
      compareEl.innerHTML = '';
    }
  }

  function tally(n){
    var out = '';
    while (n > 0) {
      var k = Math.min(n, 5); n -= k;
      var w = k === 5 ? 34 : 4 + (k - 1) * 8 + 4;
      var s = '<svg width="' + w + '" height="30" viewBox="0 0 ' + w + ' 30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">';
      for (var j = 0; j < Math.min(k, 4); j++) { var x = 5 + j * 8; s += '<line x1="' + x + '" y1="4" x2="' + x + '" y2="26"/>'; }
      if (k === 5) s += '<line x1="1" y1="22" x2="33" y2="8" stroke="var(--shrimp)"/>';
      out += s + '</svg>';
    }
    return out;
  }

  function addScoop(){
    if (entry === '') return;
    state.scoops.push(+entry);
    entry = '';
    save(); render();
  }

  $('pad').addEventListener('click', function(e){
    var k = e.target.closest('button'); if (!k) return;
    k = k.dataset.k;
    if (k === 'add') return addScoop();
    if (k === 'back') entry = entry.slice(0,-1);
    else if (k === 'clear') entry = '';
    else if (entry.length < 6) entry = (entry === '0' ? '' : entry) + k;
    renderEntry();
  });

  document.addEventListener('keydown', function(e){
    if (e.target.tagName === 'INPUT') return;
    if (/^[0-9]$/.test(e.key) && entry.length < 6) { entry = (entry === '0' ? '' : entry) + e.key; renderEntry(); }
    else if (e.key === 'Backspace') { entry = entry.slice(0,-1); renderEntry(); }
    else if (e.key === 'Enter') addScoop();
  });

  ['scoop','cup','tanks','trucks','orderQty'].forEach(function(id){
    $(id).addEventListener('input', function(){ state[id] = num(this.value); save(); render(); });
  });
  document.querySelectorAll('[data-step]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.dataset.step;
      var v = Math.max(0, Math.round((num(state[id]) + parseFloat(b.dataset.d)) * 10) / 10);
      state[id] = v; save(); render();
    });
  });

  $('mSum').onclick = function(){ state.mode = 'sum'; save(); render(); };
  $('mAvg').onclick = function(){ state.mode = 'avg'; save(); render(); };
  $('undo').onclick = function(){ state.scoops.pop(); save(); render(); };
  var resetArmed = false, resetTimer = null;
  $('reset').onclick = function(){
    var btn = $('reset');
    if (state.scoops.length && !resetArmed) {
      resetArmed = true;
      btn.textContent = 'กดอีกครั้งเพื่อล้าง';
      resetTimer = setTimeout(function(){ resetArmed = false; btn.textContent = 'เริ่มนับใหม่'; }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    btn.textContent = 'เริ่มนับใหม่';
    state.scoops = []; entry = ''; save(); render();
  };

  render();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {
      // ignore registration errors (e.g. running from file://)
    });
  });
}

// Tells the parent shell (index.html) which way this tab is being scrolled,
// so the weather/tab bar there can collapse out of the way on scroll-down
// and reappear at the top — this page has no visibility into that outer
// page's layout otherwise, since it lives in its own iframe.
if (window.parent !== window) {
  let lastScrollY = window.scrollY;
  let scrollTicking = false;
  window.addEventListener('scroll', () => {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      const atTop = y <= 4;
      if (atTop || Math.abs(y - lastScrollY) >= 4) {
        const dir = y > lastScrollY ? 'down' : 'up';
        lastScrollY = y;
        window.parent.postMessage({ type: 'shimcal-scroll', dir, atTop }, '*');
      }
      scrollTicking = false;
    });
  }, { passive: true });
}
</script>
